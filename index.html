<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mars: The Last Colony</title>
<meta name="description" content="Colônias em Marte: campanha solo, sandbox e multiplayer com equipes, chat, amigos e eventos.">
<link rel="stylesheet" href="css/style.css">
</head><body>
<canvas id="c" role="img" aria-label="Mapa 3D do jogo"></canvas>

<!-- ===== telas ===== -->
<div id="auth" class="scr col pg on"></div>
<div id="menu" class="scr col"></div>
<div id="cat" class="scr col pg"><div class="top"><button id="cb">← Voltar</button><h2>Catálogo de fases</h2><span id="catinfo" class="mu"></span></div><div id="grid"></div></div>
<div id="hud" class="scr">
  <div class="bar" id="topbar"></div>
  <div class="mid"><div class="pill" id="hint"></div></div>
  <div id="joy"><i></i></div>
  <button id="nt" class="rnd">Impulso</button>
  <button id="act" class="rnd act" style="display:none"></button>
  <button id="tiltb" class="pill" style="display:none"></button>
  <div id="pk" class="pill" data-min="👥 Sala"></div>
  <div class="bar" id="pal"></div>
</div>
<div id="lob" class="scr col pg"></div>
<div id="wait" class="scr col pg"></div>
<div id="ward" class="scr pg"></div>
<div id="lbd" class="scr col pg"><div class="top"><button id="lbb">← Voltar</button><h2>Leaderboard</h2></div><div id="lbl" class="w"></div></div>
<div id="soc" class="scr col pg"></div>
<div id="ulv" class="scr col pg ulv"></div>

<!-- ===== painéis flutuantes ===== -->
<div id="inhud" class="scr"><div class="bar"><button id="inx">⏎ Sair do edifício</button><div class="pill" id="ini" data-min="🏭 Edifício"></div></div><div class="mid"><div class="pill" id="inh"></div></div><div id="joy2"><i></i></div><button id="act2" class="rnd act" style="display:none"></button></div>
<div id="chat" class="panel"></div>
<div id="cpu" class="panel cpu" role="region" aria-label="Computador de bordo"></div>
<button id="cpuline" style="display:none" aria-live="polite"></button>
<button id="cpubtn" title="Computador de bordo (H): diz o próximo passo" aria-label="Computador de bordo">🖥 <small>H</small></button>
<button id="chb" class="fab" title="Chat">💬<b id="chn"></b></button>
<div id="toasts"></div>
<button id="setbtn" title="Configurações (som, música e cliques)"><span class="ic">⚙</span><span class="tx">Configurações</span></button>

<!-- ===== modais ===== -->
<div class="mod" id="shop"><div class="box"><div class="up"><b>Loja de upgrades</b><span>🪙 <b id="sc">0</b> · 🔬 <b id="sr">0</b> RP</span></div><div id="sl"></div><button id="sx" style="margin-top:10px">Fechar</button></div></div>
<div class="mod" id="res"><div class="box"><h2 id="rt"></h2><p id="rp"></p><div id="rb" class="row"></div></div></div>
<div class="mod" id="fin"><div class="box" style="text-align:center"><img id="fi" alt="" style="width:100%;border-radius:8px"><button id="fb" style="margin-top:10px">Voltar ao catálogo</button></div></div>
<div class="mod" id="dlg"><div class="box"><div id="dlgb"></div></div></div>
<div class="mod" id="setm"><div class="box"><div id="setb"></div></div></div>
<div class="mod" id="adm"><div class="box wide"><div id="admb"></div></div></div>

<script src="vendor/three.min.js"></script>
<script src="vendor/GLTFLoader.js"></script>
<script src="vendor/SkeletonUtils.js"></script>
<script src="vendor/RoundedBoxGeometry.js"></script>
<script src="vendor/peerjs.min.js"></script>
<script src="shared/rules.js"></script>
<script src="shared/hub.js"></script>
<script src="shared/bulletin.js"></script>
<script src="js/config.js"></script>
<script src="js/bulletin.js"></script>
<script src="js/cloud.js"></script>
<script src="js/localhub.js"></script>
<script src="js/data.js"></script>
<script src="js/look.js"></script>
<script src="js/flags.js"></script>
<script src="js/state.js"></script>
<script src="js/p2p.js"></script>
<script src="js/net.js"></script>
<script src="js/world.js"></script>
<script src="js/avatar.js"></script>
<script src="js/avatar2.js"></script>
<script src="js/art2d.js"></script>
<script src="js/art3d.js"></script>
<script src="js/models.js"></script>
<script src="js/input.js"></script>
<script src="js/tilt.js"></script>
<script src="js/game.js"></script>
<script src="js/interior.js"></script>
<script src="js/nav.js"></script>
<script src="js/global.js"></script>
<script src="js/multi.js"></script>
<script src="js/ui.js"></script>
<script src="js/espaco.js"></script>
<script src="js/learn.js"></script>
<script src="js/ulv-data.js"></script>
<script src="js/ulv.js"></script>
<script src="js/ulvgame.js"></script>
<script src="js/paint.js"></script>
<script src="js/studio.js"></script>
<script src="js/music.js"></script>
<script src="js/a11y.js"></script>
<script src="js/cpu.js"></script>
<script src="js/reset.js"></script>
<script src="js/settings.js"></script>
<script src="js/main.js"></script>
</body></html>
