<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">

<title>Mars: The Last Colony</title>
<style>
:root{--bg:#120806;--pn:rgba(28,11,6,.84);--tx:#ffe9dc;--mu:#d2a68f;--ac:#ff6a2b;--ok:#4fd08a;--bd:rgba(255,140,80,.35);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#120806;--pn:rgba(28,11,6,.84)}}
:root[data-theme="dark"]{--bg:#120806;--pn:rgba(28,11,6,.84)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;position:relative;background:var(--bg);color:var(--tx);font:14px system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.scr{position:absolute;inset:0;display:none;pointer-events:none}.scr.on{display:flex}
.scr>*{pointer-events:auto}
.col{flex-direction:column;align-items:center;justify-content:center;gap:10px}
#menu{background:#120806 center/cover;text-shadow:0 2px 8px #000}
#menu::before{content:"";position:absolute;inset:0;background:linear-gradient(#0008,#000b)}
#menu>*{position:relative}
h1{font-size:clamp(40px,10vw,84px);margin:0;letter-spacing:.12em;color:var(--ac);line-height:1}
h1 small{display:block;font-size:.26em;letter-spacing:.5em;color:var(--tx)}
button{font:inherit;color:var(--tx);background:var(--pn);border:1px solid var(--bd);border-radius:8px;padding:9px 14px;cursor:pointer}
button:hover{border-color:var(--ac)}button.sel{background:var(--ac);color:#1a0800;font-weight:700}
#menu button{width:min(86vw,360px);font-size:16px;padding:12px}
input{font:inherit;background:var(--pn);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:8px;width:160px;text-align:center}
#cat{background:rgba(12,5,3,.94);justify-content:flex-start;padding:12px;overflow:auto;pointer-events:auto}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;width:min(1100px,100%)}
.card{border:1px solid var(--bd);border-radius:12px;overflow:hidden;background:var(--pn);cursor:pointer}
.card img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}
.card.lk{opacity:.45;cursor:not-allowed}.card div{padding:10px}.card b{display:block;font-size:15px}
.card p{margin:4px 0;color:var(--mu);font-size:12px}
.top{display:flex;gap:12px;align-items:center;width:min(1100px,100%)}.top h2{margin:0}
#hud{flex-direction:column;justify-content:space-between}
.bar{display:flex;gap:8px;flex-wrap:wrap;padding:8px;align-items:flex-start}
.pill{background:var(--pn);border:1px solid var(--bd);border-radius:8px;padding:7px 11px}
#gl{max-width:270px;font-size:12px}#gl div{margin-top:3px}.dn{color:var(--ok)}.tb{display:flex;gap:6px;align-items:center;font-size:11px;margin:2px 0}.tb span{width:78px}.tb u{flex:1;height:6px;background:#0007;border-radius:3px;overflow:hidden}.tb i{display:block;height:100%}.tb em{font-style:normal;width:12px}
#pk{position:absolute;right:8px;top:62px;max-width:200px;font-size:12px;display:none}
#pal{justify-content:center}#pal button{font-size:12px;padding:7px 9px}
.mod{position:absolute;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:5;padding:12px}
.mod.on{display:flex}.box{background:#1b0b06;border:1px solid var(--bd);border-radius:12px;padding:16px;width:min(560px,100%);max-height:86%;overflow:auto}
.up{display:flex;gap:8px;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd)}
.up p{margin:2px 0;font-size:12px;color:var(--mu)}.pg{background:rgba(12,5,3,.94);justify-content:flex-start;padding:12px;overflow:auto;pointer-events:auto}.w{width:min(700px,100%)}.tag{font-size:10px;color:var(--ac);text-transform:uppercase}
</style></head><body>

function nSpawn(cell){const n=N,r=cell?1.2:1.5+Math.random()*2.6,m=new THREE.Mesh(cell?new THREE.SphereGeometry(r,10,8):new THREE.DodecahedronGeometry(r),cell?new THREE.MeshLambertMaterial({color:0x44ff88,emissive:0x22cc66}):new THREE.MeshLambertMaterial({color:0x7a6a60,flatShading:true})),aim=!cell&&Math.random()<.5;
m.position.set(aim?n.x+(Math.random()-.5)*6:(Math.random()-.5)*68,aim?n.y+(Math.random()-.5)*4:(Math.random()-.5)*38,-260);sc.add(m);n.g.push(m);n.obs.push({m,r:cell?2.4:r,cell})}
function navEnd(ok,q,why){G.run=false;const ph=PH[G.ph];
if(ok){const rw=Math.round(ph.r*(1+B("rw"))*(.7+q*.6)),rp=10+3*G.ph;G.avg=Math.round(q*100);G.rank=ph.nav==1?"Chegada a Marte!":"Pouso perfeito!";S.coins+=rw;S.done[G.ph]=1;save();P.cr+=5;P.rp+=rp;saveP();end(true,rw);
$("#rp").textContent=`${ph.nav==1?"Casco restante":"Combustível restante"}: ${G.avg}%. Você ganhou ${rw} moedas e ${rp} RP.`}
else{G.why=why;end(false);$("#rp").textContent=why+". Tente de novo."}}
function navTick(dt){const n=N,k=n.keys,ix=((k.r?1:0)-(k.l?1:0))||n.nx,iy=((k.u?1:0)-(k.d?1:0))||n.ny,th=(k.s||n.btn)&&n.fuel>0;n.t+=dt;n.shake*=.9;
if(n.L=="fly"){const tx=ix*28,ty=iy*16,f=Math.min(1,3*dt);n.x+=(tx-n.x)*f;n.y+=(ty-n.y)*f;const spd=th?40:22;n.fuel=Math.max(0,n.fuel-(.8+(th?4:0))*dt);n.prog=Math.min(1,n.prog+spd*dt/2400);
n.sp-=dt;if(n.sp<=0){n.sp=Math.max(.25,.7-n.prog*.3);nSpawn(0)}n.cp-=dt;if(n.cp<=0){n.cp=2.2;nSpawn(1)}
n.obs.forEach(o=>{o.m.position.z+=spd*dt;o.m.rotation.x+=dt;o.m.rotation.y+=dt*.7;
if(!o.d&&o.m.position.z>-3&&o.m.position.z<3&&Math.hypot(o.m.position.x-n.x,o.m.position.y-n.y)<o.r+1.6){o.d=1;if(o.cell)n.fuel=Math.min(100,n.fuel+18);else{n.hull-=10+o.r*2;n.shake=.6}o.m.visible=false}
if(o.m.position.z>20)o.gone=1});n.obs=n.obs.filter(o=>{if(o.gone)sc.remove(o.m);return !o.gone});
const dp=n.dust.geometry.attributes.position;for(let i=2;i<dp.array.length;i+=3){dp.array[i]+=spd*dt;if(dp.array[i]>20)dp.array[i]=-260}dp.needsUpdate=true;
n.earth.position.set(-70,-35,-40+n.prog*900);n.mars.position.set(40,10,-(1-n.prog)*1100-140);
n.ship.position.set(n.x,n.y,0);n.ship.rotation.z=-(tx-n.x)*.03;n.ship.rotation.x=(ty-n.y)*.02;n.ship.flame.scale.set(1,th?1.8:.6,1);
if(n.hull<=0)navEnd(0,0,"Nave destruída pelos asteroides");else if(n.fuel<=0&&n.prog<1)navEnd(0,0,"Sem combustível: a nave ficou à deriva");else if(n.prog>=1)navEnd(1,n.hull/100)}
else{const c=.0004+.002*(1-clamp(n.y/600,0,1));n.vy+=(-5-c*n.vy*Math.abs(n.vy)+(th?14:0))*dt;n.vx+=(ix*7-n.vx*.4)*dt;n.vz+=(-iy*7-n.vz*.4)*dt;
n.x=clamp(n.x+n.vx*dt,-120,120);n.z=clamp(n.z+n.vz*dt,-120,120);n.y+=n.vy*dt;if(th)n.fuel=Math.max(0,n.fuel-10*dt);
n.ship.position.set(n.x,n.y,n.z);n.ship.rotation.x=Math.PI/2+n.vz*.01;n.ship.rotation.z=-n.vx*.01;n.ship.flame.scale.set(1,th?1.8:.4,1);
n.heat.material.opacity=clamp((Math.abs(n.vy)-35)/40,0,.6)*clamp(n.y/150,0,1);
const gy=H(n.x,n.z)+2;if(n.y<=gy){n.y=gy;const ok=Math.abs(n.vy)<=5&&Math.hypot(n.x,n.z)<=9&&Math.hypot(n.vx,n.vz)<=4;
navEnd(ok,n.fuel/100,Math.abs(n.vy)>5?"Impacto: velocidade vertical alta demais":"Pouso fora da plataforma ou com deriva excessiva")}}}
function navCam(){const n=N;if(!n)return;const s=n.shake*(Math.random()-.5);
if(n.L=="fly"){cam.position.set(n.x*.6+s,n.y*.6+5+s,16);cam.lookAt(n.x*.6,n.y*.6,-30)}else{cam.position.set(n.x+s,n.y+14,n.z+24);cam.lookAt(n.x*.8,Math.max(0,n.y-60),n.z-20)}}
function navHud(){const n=N;if(!n)return;$("#hc").textContent=Math.floor(S.coins);
const row=(a,p,c,t)=>`<div class="tb"><span>${a}</span><u><i style="width:${clamp(p,0,100)}%;background:${c}"></i></u><b style="width:56px;text-align:right">${t}</b></div>`;
let s=row("Combustível",n.fuel,TC.fuel,Math.floor(n.fuel)+"%");
if(n.L=="fly")s+=row("Casco",n.hull,"#ff6a6a",Math.max(0,Math.floor(n.hull))+"%")+row("Trajeto",n.prog*100,TC.water,Math.floor(n.prog*100)+"%");
else s+=row("Altitude",n.y/6,TC.water,Math.max(0,Math.floor(n.y))+" m")+row("Veloc. vert.",Math.abs(n.vy),Math.abs(n.vy)<=5?"#4fd08a":"#ff6a6a",Math.abs(n.vy).toFixed(1)+" m/s");
$("#tk").innerHTML=s;$("#gl").innerHTML=n.L=="fly"?"<b>Terra → Marte</b><div>Desvie dos asteroides (setas/WASD ou arraste). Segure Impulso (Espaço) para acelerar, gastando combustível. Colete as esferas verdes: recarregam combustível.</div>":"<b>Entrada e pouso</b><div>Pouse na plataforma verde com velocidade vertical ≤ 5 m/s. Segure Impulso (Espaço) para frear; setas ou arraste guiam o deslocamento.</div>"}
function kk(e,v){if(!N)return;const m={ArrowLeft:"l",a:"l",A:"l",ArrowRight:"r",d:"r",D:"r",ArrowUp:"u",w:"u",W:"u",ArrowDown:"d",s:"d",S:"d"," ":"s"}[e.key];if(m){N.keys[m]=v;e.preventDefault()}}
addEventListener("keydown",e=>kk(e,1));addEventListener("keyup",e=>kk(e,0));
cv.addEventListener("pointermove",e=>{if(N&&(e.buttons>0||e.pointerType=="touch")){N.nx=clamp((e.clientX/innerWidth-.5)*2.4,-1,1);N.ny=clamp(-(e.clientY/innerHeight-.5)*2.4,-1,1)}});
cv.addEventListener("pointerup",()=>{if(N){N.nx=0;N.ny=0}});
$("#nt").addEventListener("pointerdown",e=>{if(N)N.btn=1;e.preventDefault()});["pointerup","pointerleave","pointercancel"].forEach(ev=>$("#nt").addEventListener(ev,()=>{if(N)N.btn=0}));
// ---------- loop ----------
let last=performance.now();
function loop(n){const dt=Math.min(.1,(n-last)/1000),t=n/1000;last=n;
if(G.run&&!G.paused){tick(dt);hud();const st=G.mode=="solo"&&PH[G.ph].storm;
if(G.mode!="nav")sc.fog.color.set(st?0x4a1c10:0x9a4526);if(G.mode!="nav")sc.fog.density=st?.014+.008*Math.sin(t*.8):.006;sun.intensity=st?.6+.2*Math.sin(t*3):1.1}
G.placed.forEach(p=>{if(p.t=="rover"){p.m.position.x=p.x+Math.cos(t*.5+p.a)*4;p.m.position.z=p.z+Math.sin(t*.5+p.a)*4;p.m.rotation.y=-(t*.5+p.a)}
if(p.t=="drill"&&p.m.tip)p.m.tip.scale.setScalar(1+.25*Math.sin(t*4))});
if(G.mode=="nav")navCam();else camU();R.render(sc,cam);requestAnimationFrame(loop)}
menu();requestAnimationFrame(loop);loadP();
</script></body></html>
