<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <radialGradient id="spaceBg11" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#071228"/>
      <stop offset="60%" stop-color="#030814"/>
      <stop offset="100%" stop-color="#010307"/>
    </radialGradient>
    <filter id="thrustGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#spaceBg11)"/>
  
  <!-- Stars -->
  <circle cx="150" cy="80" r="1.5" fill="#fff"/>
  <circle cx="320" cy="140" r="2" fill="#fff"/>
  <circle cx="850" cy="90" r="1.2" fill="#fff"/>
  <circle cx="1050" cy="180" r="1.8" fill="#fff"/>
  <circle cx="680" cy="60" r="1.4" fill="#fff"/>

  <!-- Earth in the distance behind -->
  <circle cx="180" cy="220" r="80" fill="#0284c7"/>
  <circle cx="180" cy="220" r="80" fill="none" stroke="#38bdf8" stroke-width="3" opacity="0.6"/>
  <path d="M 140 180 Q 180 200 220 180 Q 200 240 150 250 Z" fill="#16a34a" opacity="0.8"/>
  <ellipse cx="180" cy="220" rx="85" ry="30" fill="none" stroke="#fff" opacity="0.25" transform="rotate(-20 180 220)"/>

  <!-- Mars glowing red ahead in trajectory -->
  <circle cx="1020" cy="240" r="55" fill="#e11d48"/>
  <circle cx="1020" cy="240" r="55" fill="none" stroke="#fb7185" stroke-width="2" opacity="0.8"/>
  <circle cx="1000" cy="220" r="15" fill="#9f1239"/>

  <!-- Hohmann Transfer Trajectory Arc -->
  <path d="M 240 230 Q 600 80 970 230" fill="none" stroke="#00f0ff" stroke-width="3" stroke-dasharray="12,8" opacity="0.7"/>

  <!-- Interplanetary Fleet Starship Ship -->
  <polygon points="560,180 720,200 560,220 540,200" fill="#f8fafc" stroke="#38bdf8" stroke-width="2"/>
  <rect x="580" y="192" width="60" height="16" fill="#0284c7"/>
  <polygon points="540,190 540,210 460,200" fill="#ff7a18" opacity="0.8" filter="url(#thrustGlow)"/>
  <line x1="540" y1="200" x2="420" y2="200" stroke="#00f0ff" stroke-width="4" filter="url(#thrustGlow)"/>

  <!-- Solar Radiations Waves -->
  <path d="M 400 320 Q 600 300 800 320" fill="none" stroke="#ffaa00" stroke-width="2" stroke-dasharray="8,6" opacity="0.5"/>
  <path d="M 380 350 Q 600 330 820 350" fill="none" stroke="#ffaa00" stroke-width="2" stroke-dasharray="8,6" opacity="0.4"/>

  <!-- Sci-Fi HUD Banner -->
  <rect x="180" y="540" width="840" height="95" rx="12" fill="rgba(7, 18, 40, 0.9)" stroke="#00f0ff" stroke-width="2"/>
  <text x="600" y="580" fill="#00f0ff" font-family="'Orbitron', sans-serif" font-size="26" font-weight="900" letter-spacing="4" text-anchor="middle">A GRANDE TRAVESSIA INTERPLANETÁRIA</text>
  <text x="600" y="612" fill="#f8fafc" font-family="'Rajdhani', sans-serif" font-size="18" font-weight="bold" letter-spacing="2" text-anchor="middle">ÓRBITA DE TRANSFERÊNCIA DE HOHMANN • 250 DIAS NO VÁCUO PROFUNDO</text>
  
  <rect x="40" y="35" width="350" height="50" rx="8" fill="rgba(0, 240, 255, 0.2)" stroke="#00f0ff"/>
  <text x="55" y="68" fill="#00f0ff" font-family="'Orbitron', sans-serif" font-size="18" font-weight="bold">FASE 11: A GRANDE TRAVESSIA</text>
</svg>