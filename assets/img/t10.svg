<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <radialGradient id="terraSky" cx="50%" cy="25%" r="75%">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="40%" stop-color="#112238"/>
      <stop offset="100%" stop-color="#080e1a"/>
    </radialGradient>
    <filter id="megaTerra">
      <feGaussianBlur stdDeviation="10" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#terraSky)"/>

  <!-- Terraforming Giant Energy Beam to the Upper Atmosphere -->
  <polygon points="560,400 640,400 730,0 470,0" fill="#00f0ff" opacity="0.25" filter="url(#megaTerra)"/>
  <line x1="600" y1="400" x2="600" y2="0" stroke="#f8fafc" stroke-width="4" filter="url(#megaTerra)"/>

  <!-- Colossal Terraforming Atmospheric Emitter Tower -->
  <polygon points="580,240 620,240 640,420 560,420" fill="#f8fafc" stroke="#00f0ff" stroke-width="3"/>
  <ellipse cx="600" cy="240" rx="35" ry="12" fill="#00f0ff" filter="url(#megaTerra)"/>

  <!-- Planetary Mega Biosphere Dome -->
  <path d="M 120 480 A 480 370 0 0 1 1080 480 Z" fill="#0284c7" opacity="0.3" stroke="#00f0ff" stroke-width="4"/>

  <!-- Lush Green Terraformed Parks Inside Mega Dome -->
  <path d="M 160 480 Q 600 420 1040 480 Z" fill="#15803d" opacity="0.85"/>
  <ellipse cx="440" cy="460" rx="60" ry="15" fill="#38bdf8" opacity="0.8"/>

  <!-- Futuristic Civil Mega City Towers -->
  <rect x="280" y="360" width="45" height="120" fill="#e2e8f0"/>
  <rect x="340" y="320" width="55" height="160" fill="#cbd5e1"/>
  <rect x="410" y="350" width="50" height="130" fill="#f8fafc"/>
  <rect x="720" y="330" width="60" height="150" fill="#f8fafc"/>
  <rect x="795" y="300" width="55" height="180" fill="#e2e8f0"/>
  <rect x="865" y="360" width="50" height="120" fill="#cbd5e1"/>

  <!-- Ground Landscape -->
  <rect x="0" y="480" width="1200" height="195" fill="#0a101f"/>
  <line x1="0" y1="520" x2="1200" y2="520" stroke="#ffaa00" stroke-width="4" filter="url(#megaTerra)"/>

  <!-- High-Speed Maglev Train Crossing -->
  <rect x="420" y="510" width="180" height="18" rx="6" fill="#f8fafc" filter="url(#megaTerra)"/>

  <!-- Overlay Banner -->
  <rect x="220" y="550" width="760" height="90" rx="12" fill="rgba(10, 14, 28, 0.9)" stroke="#c084fc" stroke-width="2"/>
  <text x="600" y="590" fill="#c084fc" font-family="'Orbitron', sans-serif" font-size="28" font-weight="900" letter-spacing="4" text-anchor="middle" filter="url(#megaTerra)">UMA NOVA HUMANIDADE: A VITÓRIA SUPREMA</text>
  <text x="600" y="622" fill="#f8fafc" font-family="'Rajdhani', sans-serif" font-size="18" font-weight="bold" letter-spacing="2" text-anchor="middle">COLÔNIA 100% AUTOSSUSTENTÁVEL • ATIVAÇÃO DA TERRAFORMAÇÃO GLOBAL</text>

  <!-- Top Badge -->
  <rect x="40" y="35" width="340" height="50" rx="8" fill="rgba(192, 132, 252, 0.2)" stroke="#c084fc"/>
  <text x="55" y="68" fill="#c084fc" font-family="'Orbitron', sans-serif" font-size="18" font-weight="bold">FASE 10: UMA NOVA HUMANIDADE</text>
</svg>