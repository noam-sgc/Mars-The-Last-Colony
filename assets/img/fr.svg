<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <radialGradient id="badSky" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#2d0606"/>
      <stop offset="60%" stop-color="#150202"/>
      <stop offset="100%" stop-color="#050101"/>
    </radialGradient>
    <filter id="flicker">
      <feGaussianBlur stdDeviation="3" result="blur"/>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#badSky)"/>

  <!-- Dust storm haze -->
  <polygon points="0,0 1200,100 1200,675 0,675" fill="#7f1d1d" opacity="0.3"/>

  <!-- Ruined collapsed domes half-buried in sand dunes -->
  <ellipse cx="400" cy="520" rx="260" ry="140" fill="#451a03" stroke="#78350f" stroke-width="2"/>
  <path d="M 220 480 Q 380 340 540 480" fill="none" stroke="#dc2626" stroke-width="4" stroke-dasharray="10,20"/>

  <!-- Shattered dome shards -->
  <polygon points="320,400 360,450 310,460" fill="#991b1b" opacity="0.6"/>
  <polygon points="420,380 470,390 450,440" fill="#991b1b" opacity="0.5"/>

  <!-- Sand Dunes covering habitat -->
  <path d="M 0 540 Q 300 480 650 550 Q 950 620 1200 520 L 1200 675 L 0 675 Z" fill="#7c2d12"/>
  <path d="M 0 580 Q 400 530 800 600 L 1200 580 L 1200 675 L 0 675 Z" fill="#451a03"/>

  <!-- Broken Rover half-buried -->
  <rect x="740" y="520" width="70" height="35" rx="6" fill="#334155" transform="rotate(20 740 520)"/>
  <circle cx="750" cy="555" r="14" fill="#0f172a"/>
  
  <!-- Dead Red Warning Beacon blinking feebly -->
  <circle cx="380" cy="420" r="10" fill="#ef4444" filter="url(#flicker)"/>

  <!-- Defeat Banner -->
  <rect x="250" y="60" width="700" height="90" rx="12" fill="#090202" opacity="0.85" stroke="#ef4444" stroke-width="2"/>
  <text x="600" y="105" fill="#ef4444" font-family="'Orbitron', sans-serif" font-size="28" font-weight="900" text-anchor="middle">FINAL RUIM: COLAPSO DA COLÔNIA</text>
  <text x="600" y="132" fill="#cbd5e1" font-family="sans-serif" font-size="16" letter-spacing="2" text-anchor="middle">A FALTA DE PLANEJAMENTO CONDENOU A ÚLTIMA ESPERANÇA</text>
</svg>