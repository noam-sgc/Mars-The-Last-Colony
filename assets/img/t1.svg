<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <radialGradient id="space01" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0a1a3a"/>
      <stop offset="50%" stop-color="#040b1a"/>
      <stop offset="100%" stop-color="#01040a"/>
    </radialGradient>
    <filter id="glow01">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#space01)"/>
  
  <!-- Stars -->
  <circle cx="150" cy="80" r="1.5" fill="#fff"/>
  <circle cx="320" cy="140" r="2" fill="#fff"/>
  <circle cx="850" cy="90" r="1.2" fill="#fff"/>
  <circle cx="1050" cy="180" r="1.8" fill="#fff"/>
  <circle cx="680" cy="60" r="1.4" fill="#fff"/>

  <!-- Earth in distance behind -->
  <circle cx="180" cy="240" r="80" fill="#0284c7"/>
  <circle cx="180" cy="240" r="80" fill="none" stroke="#38bdf8" stroke-width="3" opacity="0.6"/>
  <path d="M 140 200 Q 180 220 220 200 Q 200 260 150 270 Z" fill="#16a34a" opacity="0.8"/>
  <ellipse cx="180" cy="240" rx="85" ry="30" fill="none" stroke="#fff" opacity="0.25" transform="rotate(-20 180 240)"/>

  <!-- Mars glowing in the distance ahead -->
  <circle cx="1020" cy="240" r="50" fill="#e11d48"/>
  <circle cx="1020" cy="240" r="50" fill="none" stroke="#fb7185" stroke-width="2" opacity="0.8"/>

  <!-- Hohmann Transfer Trajectory Arc -->
  <path d="M 240 240 Q 600 90 970 240" fill="none" stroke="#00f0ff" stroke-width="3" stroke-dasharray="12,8" opacity="0.7"/>

  <!-- Starship in transit -->
  <polygon points="560,180 720,200 560,220 540,200" fill="#f8fafc" stroke="#38bdf8" stroke-width="2"/>
  <polygon points="540,192 540,208 450,200" fill="#ff7a18" opacity="0.8" filter="url(#glow01)"/>
  <line x1="540" y1="200" x2="400" y2="200" stroke="#00f0ff" stroke-width="4" filter="url(#glow01)"/>

  <!-- Banner overlay -->
  <rect x="180" y="540" width="840" height="95" rx="12" fill="rgba(7, 18, 40, 0.9)" stroke="#00f0ff" stroke-width="2"/>
  <text x="600" y="580" fill="#00f0ff" font-family="'Orbitron', sans-serif" font-size="26" font-weight="900" letter-spacing="4" text-anchor="middle">A GRANDE TRAVESSIA INTERPLANETÁRIA</text>
  <text x="600" y="612" fill="#f8fafc" font-family="'Rajdhani', sans-serif" font-size="18" font-weight="bold" letter-spacing="2" text-anchor="middle">ÓRBITA DE TRANSFERÊNCIA DE HOHMANN • TERRA A MARTE</text>
  
  <rect x="40" y="35" width="350" height="50" rx="8" fill="rgba(0, 240, 255, 0.2)" stroke="#00f0ff"/>
  <text x="55" y="68" fill="#00f0ff" font-family="'Orbitron', sans-serif" font-size="18" font-weight="bold">FASE 01: A GRANDE TRAVESSIA</text>
</svg>