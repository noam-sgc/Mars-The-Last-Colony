<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <radialGradient id="skyShield" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#1e1035"/>
      <stop offset="50%" stop-color="#0e071c"/>
      <stop offset="100%" stop-color="#05020a"/>
    </radialGradient>
    <filter id="magGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#skyShield)"/>

  <!-- Martian Landscape in Night/Twilight -->
  <polygon points="0,500 350,470 700,510 1200,480 1200,675 0,675" fill="#1f0910"/>

  <!-- Solar Wind Cosmic Rays Coming from top left -->
  <line x1="50" y1="0" x2="350" y2="280" stroke="#f59e0b" stroke-width="2" opacity="0.6"/>
  <line x1="150" y1="0" x2="450" y2="260" stroke="#f59e0b" stroke-width="3" opacity="0.7"/>
  <line x1="250" y1="0" x2="550" y2="250" stroke="#f59e0b" stroke-width="2" opacity="0.6"/>
  <line x1="350" y1="0" x2="650" y2="240" stroke="#f59e0b" stroke-width="3" opacity="0.7"/>

  <!-- Magnetic Deflector Shield Arc (Aurora like glow) -->
  <path d="M 200 380 Q 600 80 1000 380" fill="none" stroke="#a855f7" stroke-width="12" opacity="0.7" filter="url(#magGlow)"/>
  <path d="M 220 370 Q 600 110 980 370" fill="none" stroke="#00f0ff" stroke-width="6" opacity="0.9" filter="url(#magGlow)"/>

  <!-- Giant Magnetic Dipole Emitter Towers -->
  <!-- Tower 1 -->
  <polygon points="280,360 300,360 310,500 270,500" fill="#f8fafc" stroke="#a855f7" stroke-width="2"/>
  <circle cx="290" cy="350" r="16" fill="#a855f7" filter="url(#magGlow)"/>
  <!-- Tower 2 -->
  <polygon points="890,360 910,360 920,500 880,500" fill="#f8fafc" stroke="#a855f7" stroke-width="2"/>
  <circle cx="900" cy="350" r="16" fill="#a855f7" filter="url(#magGlow)"/>

  <!-- Colony Domes Safe Below the Shield -->
  <path d="M 450 500 A 150 110 0 0 1 750 500 Z" fill="#0284c7" opacity="0.4" stroke="#00f0ff" stroke-width="3"/>
  <rect x="530" y="440" width="35" height="60" fill="#f8fafc"/>
  <rect x="580" y="420" width="40" height="80" fill="#f8fafc"/>
  <rect x="635" y="450" width="30" height="50" fill="#f8fafc"/>

  <!-- Banner overlay -->
  <rect x="180" y="540" width="840" height="95" rx="12" fill="rgba(15, 8, 30, 0.9)" stroke="#c084fc" stroke-width="2"/>
  <text x="600" y="580" fill="#c084fc" font-family="'Orbitron', sans-serif" font-size="26" font-weight="900" letter-spacing="4" text-anchor="middle">ESCUDO MAGNÉTICO ARTIFICIAL</text>
  <text x="600" y="612" fill="#f8fafc" font-family="'Rajdhani', sans-serif" font-size="18" font-weight="bold" letter-spacing="2" text-anchor="middle">DEFLEXÃO DE VENTO SOLAR &amp; PROTEÇÃO CONTRA RADIAÇÃO CÓSMICA</text>

  <rect x="40" y="35" width="350" height="50" rx="8" fill="rgba(168, 85, 247, 0.2)" stroke="#a855f7"/>
  <text x="55" y="68" fill="#c084fc" font-family="'Orbitron', sans-serif" font-size="18" font-weight="bold">FASE 09: ESCUDO MAGNÉTICO</text>
</svg>