<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <radialGradient id="skyPolar" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#142842"/>
      <stop offset="60%" stop-color="#0b1726"/>
      <stop offset="100%" stop-color="#050a12"/>
    </radialGradient>
    <filter id="iceGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#skyPolar)"/>

  <!-- Orbital Solar Mirrors Reflecting Light down to the Ice Cap -->
  <polygon points="600,10 500,420 700,420" fill="#fef08a" opacity="0.35" filter="url(#iceGlow)"/>
  <ellipse cx="600" cy="40" rx="90" ry="25" fill="#f8fafc" stroke="#fef08a" stroke-width="4" filter="url(#iceGlow)"/>

  <!-- Mars Polar Glacier Ice Cap (CO2 and Water Ice) -->
  <polygon points="0,420 300,380 600,390 900,370 1200,430 1200,675 0,675" fill="#e0f2fe"/>
  <polygon points="0,480 350,450 700,460 1050,440 1200,490 1200,675 0,675" fill="#bae6fd"/>

  <!-- Thermal Sublimation Steams into Atmosphere -->
  <ellipse cx="600" cy="400" rx="140" ry="60" fill="#ffffff" opacity="0.4" filter="url(#iceGlow)"/>
  <ellipse cx="500" cy="350" rx="70" ry="40" fill="#ffffff" opacity="0.3" filter="url(#iceGlow)"/>
  <ellipse cx="700" cy="360" rx="80" ry="45" fill="#ffffff" opacity="0.3" filter="url(#iceGlow)"/>

  <!-- Heavy Thermal Sublimator Plants on the Ice Edge -->
  <rect x="250" y="380" width="110" height="60" rx="8" fill="#1e293b" stroke="#00f0ff" stroke-width="3"/>
  <rect x="850" y="370" width="110" height="60" rx="8" fill="#1e293b" stroke="#00f0ff" stroke-width="3"/>

  <!-- Banner overlay -->
  <rect x="180" y="540" width="840" height="95" rx="12" fill="rgba(7, 18, 35, 0.9)" stroke="#38bdf8" stroke-width="2"/>
  <text x="600" y="580" fill="#38bdf8" font-family="'Orbitron', sans-serif" font-size="26" font-weight="900" letter-spacing="4" text-anchor="middle">SUBLIMAÇÃO DA CALOTA POLAR</text>
  <text x="600" y="612" fill="#f8fafc" font-family="'Rajdhani', sans-serif" font-size="18" font-weight="bold" letter-spacing="2" text-anchor="middle">ESPELHOS ORBITAIS &amp; LIBERAÇÃO DE VAPOR E CO₂ PARA ENGROSSAR A ATMOSFERA</text>

  <rect x="40" y="35" width="350" height="50" rx="8" fill="rgba(56, 189, 248, 0.2)" stroke="#38bdf8"/>
  <text x="55" y="68" fill="#38bdf8" font-family="'Orbitron', sans-serif" font-size="18" font-weight="bold">FASE 14: SUBLIMAÇÃO POLAR</text>
</svg>