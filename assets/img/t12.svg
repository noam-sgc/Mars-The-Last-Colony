<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <radialGradient id="caveBg" cx="50%" cy="60%" r="70%">
      <stop offset="0%" stop-color="#1c100b"/>
      <stop offset="50%" stop-color="#0e0705"/>
      <stop offset="100%" stop-color="#020101"/>
    </radialGradient>
    <filter id="lavaGlow">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#caveBg)"/>

  <!-- Cave Vaulted Roof Arch -->
  <path d="M 0 0 L 0 350 Q 600 80 1200 350 L 1200 0 Z" fill="#140805"/>
  <path d="M 0 0 L 0 280 Q 600 40 1200 280 L 1200 0 Z" fill="#080302"/>

  <!-- Basaltic Strata on Cave Walls -->
  <line x1="0" y1="360" x2="300" y2="400" stroke="#78350f" stroke-width="3" opacity="0.4"/>
  <line x1="1200" y1="360" x2="900" y2="400" stroke="#78350f" stroke-width="3" opacity="0.4"/>

  <!-- Skylight Opening Hole in Lava Ceiling -->
  <ellipse cx="600" cy="80" rx="140" ry="35" fill="#ff7a18" opacity="0.3" filter="url(#lavaGlow)"/>
  <polygon points="460,80 740,80 840,460 360,460" fill="#ff7a18" opacity="0.12"/>

  <!-- Underground City Domes Inside Tube -->
  <!-- Left underground dome -->
  <path d="M 220 500 A 130 95 0 0 1 480 500 Z" fill="#0284c7" opacity="0.4" stroke="#00f0ff" stroke-width="3"/>
  <rect x="290" y="440" width="30" height="60" fill="#f8fafc"/>
  <rect x="335" y="420" width="35" height="80" fill="#f8fafc"/>
  <rect x="385" y="450" width="25" height="50" fill="#f8fafc"/>

  <!-- Center Underground Hub -->
  <path d="M 460 500 A 160 120 0 0 1 780 500 Z" fill="#0369a1" opacity="0.5" stroke="#38bdf8" stroke-width="4" filter="url(#lavaGlow)"/>
  <rect x="540" y="410" width="45" height="90" fill="#ffffff"/>
  <rect x="600" y="380" width="55" height="120" fill="#ffffff"/>
  <rect x="670" y="420" width="40" height="80" fill="#ffffff"/>

  <!-- Ground -->
  <rect x="0" y="500" width="1200" height="175" fill="#0a0503"/>

  <!-- Banner overlay -->
  <rect x="180" y="540" width="840" height="95" rx="12" fill="rgba(15, 8, 5, 0.9)" stroke="#ff7a18" stroke-width="2"/>
  <text x="600" y="580" fill="#ff7a18" font-family="'Orbitron', sans-serif" font-size="26" font-weight="900" letter-spacing="4" text-anchor="middle">SUBTERRÂNEO: OS TUBOS DE LAVA</text>
  <text x="600" y="612" fill="#f8fafc" font-family="'Rajdhani', sans-serif" font-size="18" font-weight="bold" letter-spacing="2" text-anchor="middle">HABITATS PRESSURIZADOS PROTEGIDOS POR 50 METROS DE BASALTO</text>

  <rect x="40" y="35" width="350" height="50" rx="8" fill="rgba(255, 122, 24, 0.2)" stroke="#ff7a18"/>
  <text x="55" y="68" fill="#ff7a18" font-family="'Orbitron', sans-serif" font-size="18" font-weight="bold">FASE 12: TUBOS DE LAVA</text>
</svg>